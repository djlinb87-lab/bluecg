<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水藍魔力 - 全裝備配方材料計算器</title>
    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --success: #2ecc71;
            --warning: #f39c12;
        }
        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .left-panel {
            flex: 2;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .right-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: sticky;
            top: 20px;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
        }
        h2 {
            color: var(--dark);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-top: 0;
        }
        
        /* 篩選列優化 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #fdfefe;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 120px;
        }
        .filter-group.search { flex: 2; }
        .filter-bar label {
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            border-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: var(--dark);
            color: white;
        }
        .badge {
            background: var(--warning);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .type-badge {
            background: #9b59b6;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 5px;
        }
        .qty-input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add:hover { background: #2980b9; }
        
        .cart-list, .summary-list {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .btn-del {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .mat-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ddd;
        }
        .mat-name { font-weight: bold; color: #27ae60; }
        .mat-count { background: #e8f8f5; padding: 2px 8px; border-radius: 10px; color: #117a65; font-weight: bold; }
        .clear-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <h2>水藍魔力 - 全裝備配方清單</h2>
        
        <div class="filter-bar">
            <div class="filter-group search">
                <label>關鍵字搜尋</label>
                <input type="text" id="searchBar" placeholder="搜尋裝備、道具或材料..." oninput="filterData()">
            </div>
            <div class="filter-group">
                <label>大分類</label>
                <select id="categoryFilter" onchange="changeCategory()">
                    <option value="">全部類別</option>
                    <option value="武器">武器 ⚔️</option>
                    <option value="防具">防具 🛡️</option>
                    <option value="寵物裝備">寵物裝備 🐾</option>
                    <option value="其他">其他道具 🧪</option>
                </select>
            </div>
            <div class="filter-group">
                <label>裝備/道具種類</label>
                <select id="typeFilter" onchange="filterData()">
                    <option value="">全部種類</option>
                </select>
            </div>
            <div class="filter-group">
                <label>等級 (R級)</label>
                <select id="levelFilter" onchange="filterData()">
                    <option value="">所有等級</option>
                    <option value="1">R1</option>
                    <option value="2">R2</option>
                    <option value="3">R3</option>
                    <option value="4">R4</option>
                    <option value="5">R5</option>
                    <option value="6">R6</option>
                    <option value="7">R7</option>
                    <option value="8">R8</option>
                    <option value="9">R9</option>
                    <option value="10">R10</option>
                    <option value="11">R11</option>
                </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 120px;">級別 / 種類</th>
                    <th style="width: 160px;">名稱</th>
                    <th>配方內容</th>
                    <th style="width: 120px;">操作</th>
                </tr>
            </thead>
            <tbody id="equipTableBody"></tbody>
        </table>
    </div>

    <div class="right-panel">
        <h2>預計製作清單</h2>
        <div class="cart-list" id="cartList">
            <p style="color:#999; text-align:center; margin-top:20px;">尚未選取任何項目</p>
        </div>

        <h2>所需總材料統計</h2>
        <div class="summary-list" id="summaryList">
            <p style="color:#999; text-align:center; margin-top:20px;">請先添加項目</p>
        </div>
        
        <button class="clear-btn" onclick="clearCart()">清空全部選擇</button>
    </div>

    
    <script>
        
let equipments = [];
let cart = {};

const categoryFiles = {
    "武器": ["sword","axe","spear","bow","staff","throw","knife"],
    "防具": ["armor","cloth","robe","boots","helm","hat","shield","shoes"],
    "寵物裝備": ["pet_crystal","pet_collar","pet_heavy","pet_accessory","pet_light"],
    "其他": ["accessory","bomb","food","potion","injury_med","heal_med","card"]
};

async function loadCategoryData(category) {

    equipments = [];

    if (!category) {
        updateTypeOptions();
        renderTable([]);
        return;
    }

    const files = categoryFiles[category] || [];

    for (const file of files) {
        await new Promise((resolve, reject) => {

            const script = document.createElement("script");

            script.src = `./data/data_${file}.js?t=${Date.now()}`;

            script.onload = () => {

                if (window.equipments) {
                    equipments.push(...window.equipments);
                }

                script.remove();
                resolve();
            };

            script.onerror = reject;

            document.body.appendChild(script);
        });
    }

    updateTypeOptions();
    filterData();
}

async function changeCategory() {
    await loadCategoryData(
        document.getElementById('categoryFilter').value
    );
}


        // 【大升級】不再把種類寫死，而是根據 data.js 動態分析撈出種類！
        function updateTypeOptions() {
            const cat = document.getElementById('categoryFilter').value;
            const typeSelect = document.getElementById('typeFilter');
            
            // 先清空
            typeSelect.innerHTML = '<option value="">全部種類</option>';
            
            // 利用 JavaScript 的 Set 撈出目前 data.js 裡所有符合大分類的獨特種類
            let availableTypes = new Set();
            
            if (typeof equipments !== 'undefined') {
                equipments.forEach(item => {
                    if (cat === "" || item.category === cat) {
                        if (item.type) {
                            availableTypes.add(item.type);
                        }
                    }
                });
            }
            
            // 將撈出來的獨特種類排序並加入下拉選單
            Array.from(availableTypes).sort().forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                typeSelect.appendChild(opt);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('equipTableBody');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                let matText = [];
                for (let [mat, num] of Object.entries(item.materials)) {
                    matText.push(`${mat} x${num}`);
                }
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <span class="badge">R${item.level}</span>
                        <span class="type-badge">${item.type}</span>
                    </td>
                    <td class="equip-name" title="${item.note}">${item.name}</td>
                    <td style="color: #444; font-size: 13px;">
                        <strong>${matText.join('、 ')}</strong>
                        <br><small style="color:#888">${item.note || ''}</small>
                    </td>
                    <td>
                        <input type="number" id="qty-${item.id}" class="qty-input" value="1" min="1">
                        <button class="btn-add" onclick="addToCart(${item.id})">加入</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const keyword = document.getElementById('searchBar').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const type = document.getElementById('typeFilter').value;
            const level = document.getElementById('levelFilter').value;
            
            const filtered = (equipments || []).filter(item => {
                const matsString = Object.keys(item.materials).join(',').toLowerCase();
                const matchesKeyword = item.name.toLowerCase().includes(keyword) || 
                                       (item.note && item.note.toLowerCase().includes(keyword)) ||
                                       matsString.includes(keyword);
                
                const matchesCategory = category === "" || item.category === category;
                const matchesType = type === "" || item.type === type;
                const matchesLevel = level === "" || item.level == level;
                
                return matchesKeyword && matchesCategory && matchesType && matchesLevel;
            });
            
            renderTable(filtered);
        }

        function addToCart(id) {
            const qtyInput = document.getElementById(`qty-${id}`);
            const qty = parseInt(qtyInput.value) || 1;
            
            if (cart[id]) cart[id] += qty;
            else cart[id] = qty;
            
            updateUI();
        }

        function removeFromCart(id) {
            delete cart[id];
            updateUI();
        }

        function clearCart() {
            cart = {};
            updateUI();
        }

        function updateUI() {
            const cartList = document.getElementById('cartList');
            const summaryList = document.getElementById('summaryList');
            
            if (Object.keys(cart).length === 0) {
                cartList.innerHTML = '<p style="color:#999; text-align:center; margin-top:20px;">尚未選取任何項目</p>';
                summaryList.innerHTML = '<p style="color:#999; text-align:center; margin-top:20px;">請先添加項目</p>';
                return;
            }
            
            cartList.innerHTML = '';
            let totalMaterials = {};
            
            for (let [id, qty] of Object.entries(cart)) {
                const item = equipments.find(e => e.id == id);
                if (!item) continue;
                
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>[${item.type}] <strong>${item.name}</strong> × <strong>${qty}</strong> 件</span>
                    <button class="btn-del" onclick="removeFromCart(${id})">刪除</button>
                `;
                cartList.appendChild(div);
                
                for (let [matName, matQty] of Object.entries(item.materials)) {
                    if (totalMaterials[matName]) {
                        totalMaterials[matName] += (matQty * qty);
                    } else {
                        totalMaterials[matName] = (matQty * qty);
                    }
                }
            }
            
            summaryList.innerHTML = '';
            // 將總材料根據名稱排序，方便查看
            Object.keys(totalMaterials).sort().forEach(matName => {
                const totalQty = totalMaterials[matName];
                const div = document.createElement('div');
                div.className = 'mat-item';
                div.innerHTML = `
                    <span class="mat-name">${matName}</span>
                    <span class="mat-count">${totalQty} 個</span>
                `;
                summaryList.appendChild(div);
            });
        }

        // 初始化載入
        renderTable([]);
    </script>
</body>
</html>
