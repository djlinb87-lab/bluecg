<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>魔力寶貝藍色星空 - 裝備道具素材檢視器</title>
    <style>
        body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* 大分類按鈕樣式 */
        .filter-btn { padding: 10px 20px; margin-right: 10px; margin-bottom: 10px; cursor: pointer; border: none; background: #ddd; border-radius: 6px; font-weight: bold; font-size: 14px; transition: all 0.2s; }
        .filter-btn:hover { background: #ccc; }
        .filter-btn.active { background: #3498db; color: white; }
        
        /* 【全新】子分類小標籤區域與樣式 */
        .sub-filter-container { margin-top: 5px; margin-bottom: 15px; padding: 10px; background: #e2e8f0; border-radius: 8px; display: none; gap: 8px; flex-wrap: wrap; }
        .sub-btn { padding: 6px 14px; cursor: pointer; border: 1px solid #cbd5e1; background: white; border-radius: 20px; font-size: 12px; font-weight: bold; color: #475569; transition: all 0.2s; }
        .sub-btn:hover { background: #f1f5f9; }
        .sub-btn.active { background: #1e293b; color: white; border-color: #1e293b; }

        /* 卡片排版 */
        .item-list { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .item-card { background: white; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .item-title { font-size: 1.2em; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .item-meta { color: #7f8c8d; font-size: 0.9em; margin-bottom: 10px; }
        .mat-tag { background: #e8f8f5; color: #117a65; padding: 4px 8px; margin: 4px 4px 4px 0; display: inline-block; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

    <h1>⚔️ 魔力寶貝素材資料庫 (動態細項版)</h1>
    
    <div id="filter-container">
        <button class="filter-btn active" onclick="selectMainCategory(this, '全部')">全部項目 ✨</button>
        <button class="filter-btn" onclick="selectMainCategory(this, '武器')">武器 ⚔️</button>
        <button class="filter-btn" onclick="selectMainCategory(this, '防具')">防具 🛡️</button>
        <button class="filter-btn" onclick="selectMainCategory(this, '寵物裝備')">寵物裝備 🐾</button>
        <button class="filter-btn" onclick="selectMainCategory(this, '其他')">其他道具 🧪</button>
    </div>

    <div class="sub-filter-container" id="subFilterContainer"></div>

    <div class="item-list" id="item-display-zone"></div>

    <script src="data.js"></script>
    
    <script>
        let currentMainCat = '全部';
        let currentSubCat = '全部';

        window.onload = function() {
            renderPage();
        };

        // 處理主分類點擊
        function selectMainCategory(btnElement, mainCategory) {
            // 切換主按鈕高亮
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            currentMainCat = mainCategory;
            currentSubCat = '全部'; // 切換大類時，子類預設歸零

            // 更新第二層子分類按鈕
            updateSubCategoryButtons();
            // 刷新卡片
            renderItems();
        }

        // 動態生成第二層子分類細項按鈕
        function updateSubCategoryButtons() {
            const subContainer = document.getElementById('subFilterContainer');
            subContainer.innerHTML = ''; // 清空舊按鈕

            // 如果選「全部」，就不需要顯示第二層
            if (currentMainCat === '全部') {
                subContainer.style.display = 'none';
                return;
            }

            // 利用 Set 自動去重，撈出目前 data.js 裡該大類別擁有的所有細項 type
            let subTypes = new Set();
            if (typeof equipments !== 'undefined') {
                equipments.forEach(item => {
                    if (item.category === currentMainCat && item.type) {
                        subTypes.add(item.type);
                    }
                });
            }

            // 如果撈出來的細項少於或等於 1 個，也沒必要選了，直接隱藏
            if (subTypes.size <= 1) {
                subContainer.style.display = 'none';
                return;
            }

            subContainer.style.display = 'flex'; // 顯示子分類容器

            // 建立一個「全部 [子類]」的預設按鈕
            const allSubBtn = document.createElement('button');
            allSubBtn.className = 'sub-btn active';
            allSubBtn.textContent = `全部${currentMainCat}細項`;
            allSubBtn.onclick = function() { changeSubCategory(this, '全部'); };
            subContainer.appendChild(allSubBtn);

            // 把撈出來的細項（如：寵物晶石、炸彈）做成按鈕
            Array.from(subTypes).sort().forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'sub-btn';
                btn.textContent = type;
                btn.onclick = function() { changeSubCategory(this, type); };
                subContainer.appendChild(btn);
            });
        }

        // 處理子分類細項點擊
        function changeSubCategory(btnElement, subCategory) {
            // 切換小按鈕高亮
            const subButtons = document.querySelectorAll('.sub-btn');
            subButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            currentSubCat = subCategory;
            renderItems();
        }

        // 渲染卡片核心邏輯
        function renderItems() {
            const container = document.getElementById('item-display-zone');
            container.innerHTML = ''; 

            // 雙層過濾條件
            const filteredData = equipments.filter(item => {
                // 1. 先過濾大分類
                const matchMain = (currentMainCat === '全部' || item.category === currentMainCat);
                // 2. 再過濾細項種類
                const matchSub = (currentSubCat === '全部' || item.type === currentSubCat);
                
                return matchMain && matchSub;
            });

            // 生成卡片 HTML
            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let materialsHTML = '';
                for (const [matName, qty] of Object.entries(item.materials)) {
                    materialsHTML += `<span class="mat-tag">📦 ${matName} x ${qty}</span>`;
                }

                card.innerHTML = `
                    <div class="item-title">[R${item.level}] ${item.name}</div>
                    <div class="item-meta">分類: ${item.category} ➔ 細項: <strong>${item.type}</strong></div>
                    <div class="item-materials">${materialsHTML}</div>
                `;
                container.appendChild(card);
            });

            if(filteredData.length === 0) {
                container.innerHTML = '<div style="color:gray; padding:20px;">暫無此分類資料</div>';
            }
        }

        function renderPage() {
            if (typeof equipments !== 'undefined') {
                updateSubCategoryButtons();
                renderItems();
            } else {
                document.getElementById('item-display-zone').innerHTML = '<div style="color:red; padding:20px; font-weight:bold;">找不到 data.js，請先利用 Python 腳本產生資料！</div>';
            }
        }
    </script>
</body>
</html>
